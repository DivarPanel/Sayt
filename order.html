<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Müştəri sifariş siyahısı | DivarPanel.az</title><meta name="robots" content="noindex,follow"><style>*{box-sizing:border-box}body{margin:0;background:#090c11;color:#f4eddf;font:15px Arial,sans-serif}.wrap{max-width:900px;margin:35px auto;padding:22px}.panel{background:#141b24;border:1px solid #b9975266;border-radius:18px;padding:25px}.gold{color:#e8c879}.row{display:grid;grid-template-columns:90px 1fr auto;gap:15px;align-items:center;padding:14px 0;border-bottom:1px solid #ffffff18}.row img{width:90px;height:75px;object-fit:contain;background:#fff;border-radius:9px}.muted{color:#aaa;font-size:12px}.total{font-size:20px;color:#e8c879;font-weight:bold;margin-top:20px}.btn{display:inline-block;background:#d6b36a;color:#17130c;padding:13px 18px;border-radius:9px;text-decoration:none;font-weight:bold;margin-top:18px}@media(max-width:560px){.row{grid-template-columns:65px 1fr}.row img{width:65px;height:65px}.row strong{grid-column:2}.wrap{padding:12px}.panel{padding:17px}}</style></head><body><main class="wrap"><div class="panel"><h1 class="gold">DIVARPANEL.AZ</h1><h2>Müştərinin seçdiyi məhsullar</h2><p id="status" class="muted">Sifariş siyahısı yüklənir...</p><div id="items"></div><div id="total" class="total"></div><a id="whatsapp" class="btn" hidden target="_blank" rel="noopener">WhatsApp ilə sifariş göndər</a></div></main><script type="module">import{db,doc,getDoc}from'./firebase.js';const q=new URLSearchParams(location.search),token=q.get('token'),status=document.getElementById('status');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>Number(v).toLocaleString('az-AZ',{minimumFractionDigits:2,maximumFractionDigits:2})+' AZN';try{if(!token)throw Error('Sifariş linki yanlışdır.');const snap=await getDoc(doc(db,'cartShares',token));if(!snap.exists())throw Error('Sifariş linki tapılmadı və ya ləğv edilib.');const d=snap.data();if(d.expiresAt?.toDate&&d.expiresAt.toDate()<new Date())throw Error('Bu sifariş linkinin müddəti bitib.');status.textContent='Müştəri: '+(d.customerName||d.customerEmail||'Qeydiyyatdan keçmiş müştəri');let sum=0;document.getElementById('items').innerHTML=(d.items||[]).map(x=>{const line=x.price==null?null:Number(x.price)*Number(x.quantity);if(line!=null)sum+=line;return '<div class="row">'+(x.image?'<img src="'+esc(x.image)+'" alt="">':'<div></div>')+'<div><b>'+esc(x.title)+'</b><div class="muted">Kod: '+esc(x.code)+' · Ölçü: '+esc(x.size||'—')+'</div><div class="muted">Say: '+Number(x.quantity)+'</div></div><strong>'+(line==null?'Qiymət soruşulur':money(line))+'</strong></div>';}).join('');document.getElementById('total').textContent='Məlum qiymətlərlə cəmi: '+money(sum);const text='Salam, DivarPanel.az. Seçdiyim məhsullar üzrə sifariş təklifi istəyirəm. Link: '+location.href;const wa=document.getElementById('whatsapp');wa.href='https://wa.me/994552032271?text='+encodeURIComponent(text);wa.hidden=false;}catch(e){status.textContent=e.message;}</script></body></html>
