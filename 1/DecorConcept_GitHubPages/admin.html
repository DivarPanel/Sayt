<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DecorConcept — Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#202733;font-family:Arial,sans-serif}.head{background:#17212b;color:white;padding:20px}.wrap{max-width:1100px;margin:auto;padding:20px 14px}.panel{background:white;border-radius:13px;padding:17px;margin:0 0 16px;box-shadow:0 2px 12px #0000000a}h1,h2{margin-top:0}input,textarea,select{width:100%;padding:11px;border:1px solid #d6dce3;border-radius:8px;margin:5px 0 10px;font:inherit}button{border:0;border-radius:8px;padding:10px 14px;background:#1c6bba;color:white;cursor:pointer;margin:3px}button.danger{background:#b83c3c}button.gray{background:#66717d}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.item{display:flex;gap:12px;align-items:center;border-bottom:1px solid #eee;padding:10px 0}.item img{width:58px;height:58px;object-fit:cover;border-radius:7px}.item .grow{flex:1;min-width:0}.small{font-size:13px;color:#68717d}#app{display:none}.hidden{display:none}@media(max-width:600px){.row{grid-template-columns:1fr}.item{align-items:flex-start}.item button{padding:8px}}
</style></head><body><header class="head"><h1>DecorConcept Admin</h1><div>Məhsul və kateqoriya idarəetməsi</div></header><main class="wrap"><section class="panel" id="loginBox"><h2>Admin girişi</h2><form id="loginForm"><label>E-poçt</label><input id="email" type="email" required><label>Şifrə</label><input id="password" type="password" required><button>Daxil ol</button></form><p id="loginMsg" class="small"></p></section><div id="app"><section class="panel"><button id="logout" class="gray">Çıxış</button><span id="who" class="small"></span><p id="msg" class="small"></p></section><section class="panel"><h2>Kateqoriyalar</h2><form id="catForm"><input id="catName" placeholder="Yeni kateqoriyanın adı" required><button>Kateqoriya əlavə et</button></form><div id="cats"></div></section><section class="panel"><h2>Məhsul əlavə et / redaktə et</h2><form id="productForm"><input id="pid" type="hidden"><div class="row"><div><label>Məhsul adı</label><input id="title" required></div><div><label>Məhsul kodu</label><input id="code"></div><div><label>Qiymət (AZN)</label><input id="price" type="number" step="0.01"></div><div><label>Ölçü</label><input id="size"></div><div><label>Kateqoriya</label><select id="categoryId"><option value="">Kateqoriya seçin</option></select></div><div><label>Şəkil URL</label><input id="image" type="url"></div></div><label>Qısa təsvir</label><input id="shortDescription"><label>Ətraflı təsvir (HTML və ya mətn)</label><textarea id="description" rows="4"></textarea><label><input id="visible" type="checkbox" checked style="width:auto"> Kataloqda göstər</label><br><button>Yadda saxla</button><button type="button" id="reset" class="gray">Təmizlə</button></form></section><section class="panel"><h2>Məhsullar</h2><input id="filter" placeholder="Məhsul axtar..."/><div id="products"></div></section></div></main><script type="module" src="./admin.js"></script></body></html>
