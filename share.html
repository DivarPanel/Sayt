<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DivarPanel — Müştəri kataloqu</title><style>
:root{color-scheme:dark;--gold:#d6b36a;--line:#343e4b;--muted:#aeb6c1}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#202a38,#090c11 65%);color:#f3ecdf;font:16px Arial,sans-serif}header{padding:22px max(16px,calc((100% - 1180px)/2));border-bottom:1px solid #c9a85e55;background:#10151d}.brand{font-size:22px;font-weight:900;letter-spacing:.12em;color:var(--gold)}main{max-width:1180px;margin:auto;padding:28px 16px 60px}h1{font-size:clamp(26px,4vw,42px);margin:0 0 10px}.muted{color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:22px}.grid.layout-compact{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:linear-gradient(145deg,#171e28,#10151d);border:1px solid var(--line);border-radius:15px;overflow:hidden}.photo{aspect-ratio:4/3;background:#0d1219}.photo img{width:100%;height:100%;object-fit:cover}.info{padding:14px}.info h2{font-size:18px;margin:0 0 10px}.price{font-size:19px;color:var(--gold);font-weight:800;margin:8px 0}.old{text-decoration:line-through;color:#9299a4}.small{font-size:13px;color:var(--muted);line-height:1.5}.wa,button{display:inline-block;background:linear-gradient(120deg,#e3c47d,#a87c36);color:#17130c;border:0;border-radius:9px;padding:11px 14px;text-decoration:none;font-weight:800;margin-top:10px;cursor:pointer}.topactions{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.empty{padding:30px;text-align:center;color:var(--muted)}.layout-list{grid-template-columns:1fr}.layout-list .card{display:grid;grid-template-columns:240px 1fr}.layout-list .photo{height:100%;min-height:180px}.layout-compact .info{padding:10px}.layout-compact .info h2{font-size:15px}@media(max-width:850px){.grid,.grid.layout-compact{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){main{padding:22px 12px 40px}.grid,.grid.layout-compact{grid-template-columns:1fr}.layout-list .card{grid-template-columns:115px 1fr}.layout-list .photo{min-height:140px}.info{padding:12px}}@media print{body{background:white;color:#111}.card{break-inside:avoid;background:white;color:#111;border:1px solid #ddd}.muted,.small{color:#444}header,.topactions,.wa{display:none!important}.grid{grid-template-columns:repeat(3,1fr)}main{max-width:none;padding:0}}
</style></head><body><header><div class="brand">DIVARPANEL</div><div class="small">İNTERYER · EKSTERYER · DEKOR</div></header><main><div id="state" class="empty">Kataloq yüklənir...</div><section id="content" hidden><h1 id="title"></h1><p id="intro" class="muted"></p><div class="topactions"><button id="print">PDF kimi saxla / Çap et</button><a id="contact" class="wa" href="#" target="_blank" rel="noopener">WhatsApp ilə əlaqə</a></div><div id="products" class="grid"></div></section></main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';import{getFirestore,doc,getDoc}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';import{firebaseConfig}from'./firebase-config.js';const db=getFirestore(initializeApp(firebaseConfig)), $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=new URLSearchParams(location.search).get('id');function money(v){return Number(v).toLocaleString('az-AZ',{minimumFractionDigits:2,maximumFractionDigits:2})+' AZN';}
try{if(!id)throw Error('Kataloq linki düzgün deyil.');const snap=await getDoc(doc(db,'sharedCatalogs',id));if(!snap.exists())throw Error('Kataloq tapılmadı və ya silinib.');const d=snap.data();if(d.active===false)throw Error('Bu kataloq artıq aktiv deyil.');if(d.expiresAt?.toDate&&d.expiresAt.toDate().getTime()<Date.now())throw Error('Bu kataloqun istifadə müddəti bitib.');$('title').textContent=d.title||'Məhsul kataloqu';$('intro').textContent=d.message||'Sizin üçün seçilmiş məhsullar';$('content').hidden=false;$('state').hidden=true;const o=d.options||{},grid=$('products');grid.className='grid'+(['list','compact'].includes(d.layout)?' layout-'+d.layout:'');grid.innerHTML=(d.products||[]).map(p=>{const sale=o.showDiscount&&p.oldPrice!=null&&p.price!=null&&Number(p.oldPrice)>Number(p.price);let desc=String(p.description||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();return `<article class="card">${o.showImages&&p.image?`<div class="photo"><img loading="lazy" src="${esc(p.image)}" alt="${esc(p.title)}"></div>`:''}<div class="info"><h2>${esc(p.title)}</h2>${o.showCode?`<div class="small">Kod: ${esc(p.code)}</div>`:''}${o.showSize&&p.size?`<div class="small">Ölçü: ${esc(p.size)}</div>`:''}${o.showPrice?(sale?`<div class="small"><span class="old">${money(p.oldPrice)}</span></div><div class="price">${money(p.price)} / ${esc(p.priceUnit)}</div>`:`<div class="price">${p.price==null?'Qiymət üçün əlaqə':money(p.price)+' / '+esc(p.priceUnit)}</div>`):''}${o.showDescription&&desc?`<p class="small">${esc(desc)}</p>`:''}${o.showWhatsApp?`<a class="wa" target="_blank" rel="noopener" href="https://wa.me/${encodeURIComponent(d.phone||'994552032271')}?text=${encodeURIComponent('Salam, '+p.title+' məhsulu ilə maraqlanıram. Kod: '+p.code)}">Sifariş et</a>`:''}</div></article>`;}).join('')||'<div class="empty">Bu kataloqda məhsul yoxdur.</div>';$('contact').href='https://wa.me/'+String(d.phone||'994552032271').replace(/\D/g,'');$('print').onclick=()=>window.print();}catch(e){$('state').textContent=e.message||'Kataloq açıla bilmədi.';}
</script></body></html>
