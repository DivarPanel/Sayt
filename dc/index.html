<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><meta name="description" content="DecorConcept məhsul kataloqu. Məhsulları axtarın, ölçü və qiymətə baxın, WhatsApp ilə sifariş edin.">
<title>DecorConcept — Məhsul kataloqu</title>
<style>
:root{--ink:#172033;--muted:#667085;--line:#e5e7eb;--brand:#0f766e;--bg:#f6f7f9;--white:#fff}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}header{background:#111827;color:white;padding:24px max(18px,calc((100% - 1200px)/2));}header .top{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}h1{font-size:clamp(24px,4vw,36px);margin:0 0 7px}header p{margin:0;color:#d1d5db}.wa-head{background:#16a34a;color:white;text-decoration:none;padding:11px 15px;border-radius:10px;font-weight:700}.wrap{max-width:1200px;margin:auto;padding:20px 16px 50px}.tools{display:grid;grid-template-columns:minmax(220px,1fr) minmax(160px,250px);gap:10px;margin-bottom:16px}.tools input,.tools select{width:100%;padding:13px 14px;border:1px solid #d0d5dd;border-radius:10px;background:white;font-size:15px}.status{color:var(--muted);font-size:14px;margin:10px 0 16px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px #10182814}.photo{height:240px;background:#f1f3f5;display:flex;align-items:center;justify-content:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:contain}.info{padding:13px;display:flex;flex-direction:column;gap:8px;flex:1}.name{font-weight:700;line-height:1.35}.price{font-size:20px;font-weight:800;color:var(--brand)}.small{font-size:12px;color:var(--muted)}.short{font-size:13px;color:#475467;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.order{margin-top:auto;text-align:center;background:#16a34a;color:white;text-decoration:none;border-radius:9px;padding:10px;font-size:14px;font-weight:700}.empty{padding:45px;text-align:center;color:var(--muted);grid-column:1/-1}.modal{position:fixed;inset:0;background:#111827b8;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}.modal.open{display:flex}.dialog{background:white;border-radius:16px;max-width:900px;width:100%;max-height:92vh;overflow:auto;position:relative}.close{position:sticky;top:8px;float:right;margin:8px 8px 0 0;border:0;border-radius:50%;width:38px;height:38px;font-size:24px;background:#f2f4f7;cursor:pointer;z-index:2}.detail{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:20px}.detail img{width:100%;max-height:520px;object-fit:contain;background:#f7f7f7;border-radius:12px}.detail h2{margin:8px 0 12px;line-height:1.25}.desc{line-height:1.6;color:#344054;overflow-wrap:anywhere}.desc img{display:none}.desc ul,.desc ol{padding-left:22px}.detail-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.detail-actions a{padding:12px 14px;border-radius:9px;text-decoration:none;font-weight:700}.green{background:#16a34a;color:white}.grey{background:#eef2f6;color:#172033}.loading{padding:35px;text-align:center}@media(max-width:950px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.photo{height:210px}}@media(max-width:680px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo{height:170px}.tools{grid-template-columns:1fr}.detail{grid-template-columns:1fr;gap:15px;padding:14px}.detail img{max-height:340px}.info{padding:10px}.price{font-size:18px}}@media(max-width:390px){.grid{grid-template-columns:1fr}.photo{height:250px}}
</style></head>
<body>
<header><div class="top"><div><h1>DecorConcept</h1><p>Məhsul kataloqu · Ölçü, qiymət və sifariş məlumatları</p></div><a class="wa-head" href="https://wa.me/994552032271" target="_blank" rel="noopener">WhatsApp ilə əlaqə</a></div></header>
<main class="wrap"><div class="tools"><input id="search" type="search" placeholder="Məhsul adı və ya kodu ilə axtar..." aria-label="Məhsul axtarışı"><select id="sort" aria-label="Sıralama"><option value="default">Standart sıralama</option><option value="az">Ad: A–Z</option><option value="low">Qiymət: ucuzdan bahaya</option><option value="high">Qiymət: bahadan ucuza</option></select></div><div id="status" class="status">Məhsullar yüklənir…</div><section id="grid" class="grid"><div class="loading">Kataloq yüklənir…</div></section></main>
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-label="Məhsul detalları"><div class="dialog"><button class="close" id="close" aria-label="Bağla">×</button><div id="detail"></div></div></div>
<script>
const WA='https://wa.me/994552032271';let allProducts=[];const $=id=>document.getElementById(id);
function cleanText(html){const d=document.createElement('div');d.innerHTML=html||'';return (d.textContent||d.innerText||'').replace(/\s+/g,' ').trim()}
function priceOf(p){const v=(p.variants||[]).find(x=>x.available)||((p.variants||[])[0]);return v?Number(v.price)||0:0}
function skuOf(p){const v=(p.variants||[])[0];return (v&&v.sku)||String(p.id||'')}
function imageOf(p){const imgs=p.images||[];const v=(p.variants||[]).find(x=>x.featured_image&&x.featured_image.src);return (v&&v.featured_image.src)||(imgs[0]&&imgs[0].src)||''}
function formatPrice(n){return new Intl.NumberFormat('az-AZ',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)+' AZN'}
function productUrl(p){return 'https://decorconcept.az/products/'+encodeURIComponent(p.handle||'')}
function orderUrl(p){const msg=`Salam, bu məhsul haqqında məlumat və sifariş istəyirəm.\nMəhsul: ${p.title}\nKod: ${skuOf(p)}\nQiymət: ${formatPrice(priceOf(p))}\nLink: ${productUrl(p)}`;return WA+'?text='+encodeURIComponent(msg)}
function render(){let list=allProducts.filter(p=>{const q=$('search').value.trim().toLocaleLowerCase('az');return !q||(p.title+' '+skuOf(p)+' '+cleanText(p.body_html)).toLocaleLowerCase('az').includes(q)});const sort=$('sort').value;if(sort==='az')list.sort((a,b)=>a.title.localeCompare(b.title,'az'));if(sort==='low')list.sort((a,b)=>priceOf(a)-priceOf(b));if(sort==='high')list.sort((a,b)=>priceOf(b)-priceOf(a));$('status').textContent=`${list.length} məhsul göstərilir. Kataloq yeni məhsullarla avtomatik yenilənir.`;const grid=$('grid');grid.innerHTML='';if(!list.length){grid.innerHTML='<div class="empty">Axtarışa uyğun məhsul tapılmadı.</div>';return}list.forEach(p=>{const img=imageOf(p);const card=document.createElement('article');card.className='card';card.tabIndex=0;card.setAttribute('role','button');card.setAttribute('aria-label',p.title+' detallarına bax');card.innerHTML=`<div class="photo">${img?`<img loading="lazy" src="${escapeAttr(img)}" alt="${escapeAttr(p.title)}">`:'<span class="small">Şəkil yoxdur</span>'}</div><div class="info"><div class="name">${escapeHtml(p.title)}</div><div class="price">${formatPrice(priceOf(p))}</div><div class="small">Kod: ${escapeHtml(skuOf(p))}</div><div class="short">${escapeHtml(cleanText(p.body_html)||'Ətraflı məlumat üçün məhsula klikləyin.')}</div><a class="order" href="${orderUrl(p)}" target="_blank" rel="noopener">WhatsApp ilə sifariş et</a></div>`;card.addEventListener('click',e=>{if(e.target.closest('a'))return;openProduct(p)});card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openProduct(p)}});const im=card.querySelector('img');if(im)im.addEventListener('error',()=>card.remove());grid.appendChild(card)})}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escapeAttr(s){return escapeHtml(s)}
function openProduct(p){const img=imageOf(p);$('detail').innerHTML=`<div class="detail">${img?`<div><img src="${escapeAttr(img)}" alt="${escapeAttr(p.title)}"></div>`:''}<div><div class="small">MƏHSUL KODU: ${escapeHtml(skuOf(p))}</div><h2>${escapeHtml(p.title)}</h2><div class="price">${formatPrice(priceOf(p))}</div><p><b>Ölçü / xüsusiyyətlər:</b> ${escapeHtml(extractSize(p.body_html)||'Məhsul təsvirində göstərilibsə, aşağıda qeyd olunub.')}</p><div class="desc">${sanitizeDescription(p.body_html)||'Ətraflı təsvir əlavə edilməyib.'}</div><div class="detail-actions"><a class="green" target="_blank" rel="noopener" href="${orderUrl(p)}">WhatsApp ilə sifariş et</a><a class="grey" target="_blank" rel="noopener" href="${productUrl(p)}">Saytda aç</a></div></div></div>`;$('modal').classList.add('open');document.body.style.overflow='hidden'}
function extractSize(html){const t=cleanText(html);const m=t.match(/(?:ölçü|en|eni|uzunluq|hündürlük|boy|diametr|size)\s*[:\-]?\s*[^.!\n]{1,65}/i);return m?m[0].replace(/\s+/g,' ').trim():''}
function sanitizeDescription(html){const d=document.createElement('div');d.innerHTML=html||'';d.querySelectorAll('script,style,iframe,object,embed,form,button').forEach(x=>x.remove());d.querySelectorAll('*').forEach(el=>{[...el.attributes].forEach(a=>{if(a.name.toLowerCase().startsWith('on')||a.name==='style')el.removeAttribute(a.name)});if(el.tagName==='IMG')el.remove()});return d.innerHTML}
function closeModal(){$('modal').classList.remove('open');document.body.style.overflow=''}$('close').addEventListener('click',closeModal);$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});$('search').addEventListener('input',render);$('sort').addEventListener('change',render);
fetch('./products.json?updated='+Date.now()).then(r=>{if(!r.ok)throw new Error('products.json yüklənmədi');return r.json()}).then(data=>{const products=Array.isArray(data.products)?data.products:[];const seen=new Set();allProducts=products.filter(p=>{const id=String(p.id||p.handle);if(!id||seen.has(id)||!imageOf(p))return false;seen.add(id);return true});render()}).catch(err=>{$('status').textContent='Kataloq yüklənmədi. Bir az sonra yenidən cəhd edin.';$('grid').innerHTML='<div class="empty">Məhsul məlumatları hazırda yüklənə bilmədi.</div>';console.error(err)});
</script></body></html>
