<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divar Paneli Kalkulyatoru | DİVARPANEL</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #121212;
            --accent-color: #ff7700;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #222222;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Naviqasiya Menyu */
        nav {
            background-color: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 15px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            padding: 6px 14px;
            font-weight: 600;
            font-size: 0.85rem;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        nav a.active, nav a:hover {
            color: var(--accent-color);
            background: rgba(255, 119, 0, 0.12);
        }

        header {
            text-align: center;
            padding: 30px 15px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-color);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px 15px;
            flex-grow: 1;
            width: 100%;
        }

        .calc-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .calc-form, .calc-result {
            flex: 1;
            min-width: 280px;
        }

        .calc-form h2, .calc-result h3 {
            font-family: 'Playfair Display', serif;
            color: var(--accent-color);
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 10px 12px;
            background: #000000;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            font-family: inherit;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: var(--accent-color);
        }

        .primary-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: #000000;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 10px;
        }

        .primary-btn:hover {
            opacity: 0.9;
        }

        .result-box {
            background: #080808;
            padding: 18px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .result-box p {
            font-size: 0.9rem;
            margin: 6px 0;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .result-box p span {
            color: white;
            font-weight: 600;
        }

        .total-price {
            color: var(--accent-color) !important;
            font-size: 1.15rem !important;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
            margin-top: 10px;
        }

        /* Divar sxemi / Vizualizasiya */
        .wall-sketch-container {
            width: 100%;
            height: 160px;
            background: #000;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            border: 1px dashed var(--border-color);
            margin-bottom: 15px;
        }

        .wall-sketch {
            width: 85%;
            height: 80%;
            border: 2px solid var(--accent-color);
            position: relative;
            display: flex;
            flex-wrap: wrap;
            background: #111;
        }

        .panels-grid {
            width: 100%;
            height: 100%;
            display: grid;
            gap: 2px;
            padding: 2px;
        }

        .panel-item {
            background: rgba(255, 119, 0, 0.35);
            border: 1px solid rgba(255, 119, 0, 0.6);
            box-sizing: border-box;
        }

        .whatsapp-order-btn {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .whatsapp-order-btn:hover { opacity: 0.9; }

        footer {
            text-align: center;
            padding: 20px;
            background-color: #050505;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            font-size: 0.8rem;
            margin-top: auto;
        }
        footer .signature { color: var(--accent-color); font-weight: 600; margin-top: 3px; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">← Ana Səhifəyə Qayıt</a>
        <a href="kalkulyator.html" class="active">Divar Kalkulyatoru</a>
    </nav>

    <header>
        <h1 class="logo-text">DİVARPANEL</h1>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 5px;">Divar Ölçü Kalkulyatoru və Qiymət Hesablanması</p>
    </header>

    <div class="container">
        <div class="calc-wrapper">
            <!-- Sol tərəf: Ölçü və Məhsul Seçimi -->
            <div class="calc-form">
                <h2>Ölçüləri Daxil Edin</h2>
                
                <div class="input-group">
                    <label for="wallWidth">Divarın Eni (metr ilə, məs: 4.2):</label>
                    <input type="number" id="wallWidth" step="0.1" min="0.5" value="3.5">
                </div>

                <div class="input-group">
                    <label for="wallHeight">Divarın Hündürlüyü (metr ilə, məs: 2.7):</label>
                    <input type="number" id="wallHeight" step="0.1" min="0.5" value="2.6">
                </div>

                <div class="input-group">
                    <label for="productSelect">Məhsul Tipi:</label>
                    <select id="productSelect">
                        <option value="Akustik Slat Panel" data-price="45" data-width="0.6" data-height="2.8">Akustik Slat Panel (45 AZN / ədəd)</option>
                        <option value="Bambuk Fiber Panel" data-price="25" data-width="0.4" data-height="2.9">Bambuk Fiber Panel (25 AZN / ədəd)</option>
                        <option value="Mərmər Effektli 3D Panel" data-price="60" data-width="1.2" data-height="2.4">Mərmər Effektli 3D Panel (60 AZN / ədəd)</option>
                        <option value="Elektrik Kaminli Panel" data-price="850" data-width="1.5" data-height="1.0">Elektrik Kaminli Panel (850 AZN / dəst)</option>
                    </select>
                </div>

                <button id="calculateBtn" class="primary-btn">Hesabla və Vizual Bax</button>
            </div>

            <!-- Sağ tərəf: Nəticələr və Vizual Sxem -->
            <div class="calc-result">
                <h3>Hesabat</h3>
                <div class="result-box">
                    <p>Divar Sahəsi: <span id="wallArea">0</span> m²</p>
                    <p>Lazımi Panel Sayı: <span id="neededPanels">0</span> ədəd</p>
                    <p class="total-price">Yekun Qiymət: <span id="totalPrice">0 AZN</span></p>
                </div>

                <div class="wall-sketch-container">
                    <div id="wallSketch" class="wall-sketch">
                        <div id="panelsGrid" class="panels-grid"></div>
                    </div>
                </div>

                <button class="whatsapp-order-btn" onclick="sendWhatsAppOrder()">
                    💬 Hesablamanı WhatsApp ilə Göndər
                </button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 DİVARPANEL Studio ve Dizayn. Bütün hüquqlar qorunur.</p>
        <p class="signature">By Behram</p>
    </footer>

    <script>
        document.getElementById('calculateBtn').addEventListener('click', calculateWall);
        
        // Həmçinin inputlar dəyişəndə avtomatik hesablasın
        document.getElementById('wallWidth').addEventListener('input', calculateWall);
        document.getElementById('wallHeight').addEventListener('input', calculateWall);
        document.getElementById('productSelect').addEventListener('change', calculateWall);

        function calculateWall() {
            let width = parseFloat(document.getElementById('wallWidth').value);
            let height = parseFloat(document.getElementById('wallHeight').value);

            if (!width || !height || width <= 0 || height <= 0) {
                return;
            }

            let productSelect = document.getElementById('productSelect');
            let selectedOption = productSelect.options[productSelect.selectedIndex];
            
            let pricePerUnit = parseFloat(selectedOption.getAttribute('data-price'));
            let pWidth = parseFloat(selectedOption.getAttribute('data-width'));
            let pHeight = parseFloat(selectedOption.getAttribute('data-height'));

            let wallArea = width * height;
            
            // En və hündürlüyə görə tələb olunan panel sayı
            let panelsInWidth = Math.ceil(width / pWidth);
            let panelsInHeight = Math.ceil(height / pHeight);
            let totalPanels = panelsInWidth * panelsInHeight;

            let totalPrice = totalPanels * pricePerUnit;

            // Ekrana yazdırırıq
            document.getElementById('wallArea').textContent = wallArea.toFixed(2);
            document.getElementById('neededPanels').textContent = totalPanels;
            document.getElementById('totalPrice').textContent = totalPrice + ' AZN';

            // Sxemi qururuq
            let panelsGrid = document.getElementById('panelsGrid');
            panelsGrid.style.gridTemplateColumns = `repeat(${Math.min(panelsInWidth, 12)}, 1fr)`;
            panelsGrid.style.gridTemplateRows = `repeat(${Math.min(panelsInHeight, 10)}, 1fr)`;
            
            panelsGrid.innerHTML = '';
            let renderCount = Math.min(panelsInWidth * panelsInHeight, 60); // Maksimum vizual element
            for (let i = 0; i < renderCount; i++) {
                let panelDiv = document.createElement('div');
                panelDiv.classList.add('panel-item');
                panelsGrid.appendChild(panelDiv);
            }
        }

        function sendWhatsAppOrder() {
            let width = document.getElementById('wallWidth').value;
            let height = document.getElementById('wallHeight').value;
            let productSelect = document.getElementById('productSelect');
            let productName = productSelect.options[productSelect.selectedIndex].text;
            let wallArea = document.getElementById('wallArea').textContent;
            let neededPanels = document.getElementById('neededPanels').textContent;
            let totalPrice = document.getElementById('totalPrice').textContent;

            let phoneNumber = "994702283682";
            let message = `*Divar Kalkulyatoru Hesabatı - DİVARPANEL*\n\n` +
                          `📐 *Divar Eni:* ${width} m\n` +
                          `📐 *Divar Hündürlüyü:* ${height} m\n` +
                          `📊 *Ümumi Sahə:* ${wallArea} m²\n\n` +
                          `📦 *Seçilmiş Məhsul:* ${productName}\n` +
                          `🔢 *Lazımi Say:* ${neededPanels} ədəd\n` +
                          `💰 *Yekun Qiymət:* ${totalPrice}\n\n` +
                          `Salam, bu ölçülərə uyğun sifariş vermək istəyirəm.`;

            let encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/${phoneNumber}?text=${encodedMessage}`, "_blank");
        }

        // Səhifə açılan kimi ilk hesabatı etsin
        window.onload = calculateWall;
    </script>
</body>
</html>
