import {productsRef,getDocs} from './firebase.js';

const schema={"@context":"https://schema.org","@type":"Product","name":p.title,"image":p.image?[p.image]:undefined,"description":desc,"sku":p.code||p.id,"brand":{"@type":"Brand","name":"DivarPanel.az"},"offers":{"@type":"Offer","url":canonical,"priceCurrency":"AZN","price":p.price!=null?String(p.price):undefined,"availability":Number(p.stock)>0?"https://schema.org/InStock":"https://schema.org/OutOfStock","itemCondition":"https://schema.org/NewCondition"}};Object.keys(schema).forEach(k=>schema[k]===undefined&&delete schema[k]);Object.keys(schema.offers).forEach(k=>schema.offers[k]===undefined&&delete schema.offers[k]);const ld=document.createElement('script');ld.type='application/ld+json';ld.textContent=JSON.stringify(schema);document.head.append(ld);

catch(e){console.error(e);$('content').innerHTML='<h1>Məhsul yüklənmədi</h1><p>Bir az sonra yenidən yoxlayın.</p><a href="./index.html">Ana səhifə</a>';}
</script></body></html>
