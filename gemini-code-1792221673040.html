<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divar Paneli Kalkulyatoru | DİVARPANEL</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #121212;
            --accent-color: #ff7700;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #222222;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        nav {
            background-color: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 15px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            padding: 6px 14px;
            font-weight: 600;
            font-size: 0.85rem;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        nav a.active, nav a:hover {
            color: var(--accent-color);
            background: rgba(255, 119, 0, 0.12);
        }

        header {
            text-align: center;
            padding: 30px 15px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-color);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px 15px;
            flex-grow: 1;
            width: 100%;
        }

        .calc-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .calc-form, .calc-result {
            flex: 1;
            min-width: 280px;
        }

        .calc-form h2, .calc-result h3 {
            font-family: 'Playfair Display', serif;
            color: var(--accent-color);
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 10px 12px;
            background: #000000;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            font-family: inherit;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: var(--accent-color);
        }

        /* Seçilmiş məhsulun şəkil və məlumat kartı */
        .selected-product-preview {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #080808;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
        }

        .selected-product-preview img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .selected-product-info h4 {
            font-size: 0.9rem;
            color: white;
            margin-bottom: 3px;
        }

        .selected-product-info p {
            font-size: 0.75rem;
            color: var(--accent-color);
            font-weight: 600;
        }

        .primary-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: #000000;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 10px;
        }

        .primary-btn:hover { opacity: 0.9; }

        .result-box {
            background: #080808;
            padding: 18px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .result-box p {
            font-size: 0.9rem;
            margin: 6px 0;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .result-box p span {
            color: white;
            font-weight: 600;
        }

        .total-price {
            color: var(--accent-color) !important;
            font-size: 1.15rem !important;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
            margin-top: 10px;
        }

        .wall-sketch-container {
            width: 100%;
            height: 140px;
            background: #000;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            border: 1px dashed var(--border-color);
            margin-bottom: 15px;
        }

        .wall-sketch {
            width: 85%;
            height: 80%;
            border: 2px solid var(--accent-color);
            position: relative;
            display: flex;
            flex-wrap: wrap;
            background: #111;
        }

        .panels-grid {
            width: 100%;
            height: 100%;
            display: grid;
            gap: 2px;
            padding: 2px;
        }

        .panel-item {
            background: rgba(255, 119, 0, 0.35);
            border: 1px solid rgba(255, 119, 0, 0.6);
            box-sizing: border-box;
        }

        .whatsapp-order-btn {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .whatsapp-order-btn:hover { opacity: 0.9; }

        footer {
            text-align: center;
            padding: 20px;
            background-color: #050505;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            font-size: 0.8rem;
            margin-top: auto;
        }
        footer .signature { color: var(--accent-color); font-weight: 600; margin-top: 3px; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">← Ana Səhifəyə Qayıt</a>
        <a href="kalkulyator.html" class="active">Divar Kalkulyatoru</a>
    </nav>

    <header>
        <h1 class="logo-text">DİVARPANEL</h1>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 5px;">Kataloqdan Seçimlə Divar Ölçü Kalkulyatoru</p>
    </header>

    <div class="container">
        <div class="calc-wrapper">
            <!-- Sol tərəf: Ölçü və Google Sheets-dən gələn məhsul seçimi -->
            <div class="calc-form">
                <h2>Ölçü və Məhsul</h2>
                
                <div class="input-group">
                    <label for="wallWidth">Divarın Eni (metr ilə):</label>
                    <input type="number" id="wallWidth" step="0.1" min="0.5" value="3.5">
                </div>

                <div class="input-group">
                    <label for="wallHeight">Divarın Hündürlüyü (metr ilə):</label>
                    <input type="number" id="wallHeight" step="0.1" min="0.5" value="2.6">
                </div>

                <div class="input-group">
                    <label for="productSelect">Məhsul Seçin (Kataloqdan):</label>
                    <select id="productSelect">
                        <option value="">Yüklənir...</option>
                    </select>
                </div>

                <!-- Seçilmiş məhsulun şəkli və qiymət önizləməsi -->
                <div class="selected-product-preview" id="productPreviewBox" style="display: none;">
                    <img id="previewImg" src="" alt="Məhsul şəkli">
                    <div class="selected-product-info">
                        <h4 id="previewTitle">Məhsul Adı</h4>
                        <p id="previewPrice">0 AZN</p>
                    </div>
                </div>

                <button id="calculateBtn" class="primary-btn">Hesabla</button>
            </div>

            <!-- Sağ tərəf: Nəticələr və Vizual Sxem -->
            <div class="calc-result">
                <h3>Hesabat</h3>
                <div class="result-box">
                    <p>Divar Sahəsi: <span id="wallArea">0</span> m²</p>
                    <p>Təxmini Panel Sayı: <span id="neededPanels">0</span> ədəd</p>
                    <p class="total-price">Yekun Qiymət: <span id="totalPrice">0 AZN</span></p>
                </div>

                <div class="wall-sketch-container">
                    <div id="wallSketch" class="wall-sketch">
                        <div id="panelsGrid" class="panels-grid"></div>
                    </div>
                </div>

                <button class="whatsapp-order-btn" onclick="sendWhatsAppOrder()">
                    💬 Hesablamanı WhatsApp ilə Göndər
                </button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 DİVARPANEL Studio ve Dizayn. Bütün hüquqlar qorunur.</p>
        <p class="signature">By Behram</p>
    </footer>

    <script>
        const webappUrl = "https://script.google.com/macros/s/AKfycbwby0c025UGFx5ndgYUB3wF1Eydr11hS8YfCYQ1akgsvmdp3jWNCNjTn0apJeYsKl9U1w/exec";
        let productsList = [];

        // Google Sheets-dən məhsulları çəkirik
        fetch(webappUrl)
            .then(response => response.json())
            .then(rows => {
                const productRows = rows.slice(1);
                let selectElement = document.getElementById('productSelect');
                selectElement.innerHTML = '';

                productRows.forEach((row, index) => {
                    if (row.length >= 6) {
                        let title = String(row[1] || "").trim();
                        let priceStr = String(row[2] || "").trim();
                        let sizeStr = String(row[3] || "").trim();
                        let image = String(row[4] || "").trim();
                        let code = String(row[5] || "").trim();

                        // Qiymətdən rəqəmi çıxarırıq (məs: "45 AZN" -> 45)
                        let numericPrice = parseFloat(priceStr.replace(/[^0-9.]/g, '')) || 0;

                        if (title && image) {
                            productsList.push({
                                title: title + (code ? ` (${code})` : ''),
                                price: numericPrice,
                                priceText: priceStr || 'Razılaşma ilə',
                                image: image,
                                size: sizeStr
                            });

                            let option = document.createElement('option');
                            option.value = productsList.length - 1;
                            option.textContent = `${title} - ${priceStr || 'Razılaşma'}`;
                            selectElement.appendChild(option);
                        }
                    }
                });

                if (productsList.length > 0) {
                    updatePreviewAndCalc();
                }
            })
            .catch(error => {
                console.error("Məhsullar yüklənmədi:", error);
                document.getElementById('productSelect').innerHTML = '<option>Məhuları yükləmək olmadı</option>';
            });

        document.getElementById('calculateBtn').addEventListener('click', updatePreviewAndCalc);
        document.getElementById('wallWidth').addEventListener('input', updatePreviewAndCalc);
        document.getElementById('wallHeight').addEventListener('input', updatePreviewAndCalc);
        document.getElementById('productSelect').addEventListener('change', updatePreviewAndCalc);

        function updatePreviewAndCalc() {
            let width = parseFloat(document.getElementById('wallWidth').value) || 0;
            let height = parseFloat(document.getElementById('wallHeight').value) || 0;
            let selectedIndex = document.getElementById('productSelect').value;

            if (productsList.length === 0 || selectedIndex === "") return;

            let currentProduct = productsList[selectedIndex];

            // Önizləməni (şəkil və qiymət) yeniləyirik
            let previewBox = document.getElementById('productPreviewBox');
            previewBox.style.display = 'flex';
            document.getElementById('previewImg').src = currentProduct.image;
            document.getElementById('previewTitle').textContent = currentProduct.title;
            document.getElementById('previewPrice').textContent = `Qiymət: ${currentProduct.priceText}`;

            if (width <= 0 || height <= 0) return;

            let wallArea = width * height;
            
            // Standart panel hesablama əmsalı (təxmini vahid ölçü əsasında və ya adambaşına)
            // Əgər cədvəldə ölçü varsa onu istifadə edirik, yoxdursa standart 1x1 götürürük
            let totalPanels = Math.ceil(wallArea / 1.5); // Təxmini sahə əmsalı
            if (currentProduct.price > 0) {
                // Əgər ədəd ilə satılırsa sahəyə görə hesablayırıq
                totalPanels = Math.ceil(wallArea * 2); // Nümunəvi hesablama düsturu
            }
            
            let totalPrice = totalPanels * currentProduct.price;

            // Nəticələri yazdırırıq
            document.getElementById('wallArea').textContent = wallArea.toFixed(2);
            document.getElementById('neededPanels').textContent = totalPanels;
            document.getElementById('totalPrice').textContent = currentProduct.price > 0 ? totalPrice + ' AZN' : 'Razılaşma ilə';

            // Sxem
            let panelsGrid = document.getElementById('panelsGrid');
            let cols = Math.min(Math.ceil(width * 3), 12);
            let rows = Math.min(Math.ceil(height * 3), 10);
            panelsGrid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            panelsGrid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
            
            panelsGrid.innerHTML = '';
            for (let i = 0; i < Math.min(cols * rows, 50); i++) {
                let panelDiv = document.createElement('div');
                panelDiv.classList.add('panel-item');
                panelsGrid.appendChild(panelDiv);
            }
        }

        function sendWhatsAppOrder() {
            let width = document.getElementById('wallWidth').value;
            let height = document.getElementById('wallHeight').value;
            let selectedIndex = document.getElementById('productSelect').value;
            if (productsList.length === 0 || selectedIndex === "") return;
            
            let currentProduct = productsList[selectedIndex];
            let wallArea = document.getElementById('wallArea').textContent;
            let neededPanels = document.getElementById('neededPanels').textContent;
            let totalPrice = document.getElementById('totalPrice').textContent;

            let phoneNumber = "994702283682";
            let message = `*Divar Kalkulyatoru Sifarişi - DİVARPANEL*\n\n` +
                          `📦 *Seçilmiş Məhsul:* ${currentProduct.title}\n` +
                          `💰 *Bยนตร์ Vahid Qiyməti:* ${currentProduct.priceText}\n` +
                          `📐 *Divar Ölçüləri:* ${width}m x ${height}m (${wallArea} m²)\n` +
                          `🔢 *Təxmini Say:* ${neededPanels} ədəd\n` +
                          `💵 *Yekun Məbləğ:* ${totalPrice}\n\n` +
                          `Salam, bu hesablama üzrə sifariş vermək istəyirəm. Şəkil: ${currentProduct.image}`;

            let encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/${phoneNumber}?text=${encodedMessage}`, "_blank");
        }
    </script>
</body>
</html>
