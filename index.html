<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DivarPanel Studio ve Dizayn | Rəsmi Kataloq</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #121212;
            --accent-color: #ff7700;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #222222;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-bottom: 85px;
        }

        /* Naviqasiya Menyu */
        nav {
            background-color: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 15px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            justify-content: flex-start;
            align-items: center;
            gap: 6px;
            scrollbar-width: none;
        }
        nav::-webkit-scrollbar { display: none; }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            padding: 5px 10px;
            font-weight: 600;
            font-size: 0.75rem;
            white-space: nowrap;
            transition: all 0.3s ease;
            border-radius: 6px;
        }

        nav a.active, nav a:hover {
            color: var(--accent-color);
            background: rgba(255, 119, 0, 0.12);
        }

        header {
            text-align: center;
            padding: 35px 15px 25px;
            background: linear-gradient(to bottom, #0a0a0a, var(--bg-color));
            border-bottom: 1px solid var(--border-color);
        }

        .logo-container {
            margin-bottom: 10px;
        }

        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 2.3rem;
            font-weight: 700;
            color: var(--accent-color);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 119, 0, 0.3);
        }

        .logo-subtext {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--text-muted);
            margin-top: -2px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.85rem;
            max-width: 600px;
            margin: 10px auto 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 10px;
            flex-grow: 1;
            width: 100%;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            color: var(--accent-color);
            margin: 25px 0 15px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 30px;
            animation: fadeIn 0.4s ease-in-out;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
                gap: 20px;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: border-color 0.2s ease;
        }

        .card:hover { border-color: rgba(255, 119, 0, 0.4); }

        .card-img-container {
            width: 100%;
            height: 140px;
            overflow: hidden;
            position: relative;
            background-color: #080808;
            cursor: pointer;
        }

        @media (min-width: 768px) {
            .card-img-container { height: 220px; }
        }

        .card-img-container.large-img-container {
            height: 180px;
            background-color: #050505;
        }
        @media (min-width: 768px) {
            .card-img-container.large-img-container { height: 280px; }
        }

        .card-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
