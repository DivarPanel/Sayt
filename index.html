<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DivarPanel Studio ve Dizayn | Rəsmi Kataloq</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #121212;
            --accent-color: #ff7700;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #222222;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-bottom: 85px;
        }

        /* Naviqasiya Menyu */
        nav {
            background-color: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 15px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            justify-content: flex-start;
            align-items: center;
            gap: 6px;
            scrollbar-width: none;
        }
        nav::-webkit-scrollbar { display: none; }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            padding: 5px 10px;
            font-weight: 600;
            font-size: 0.75rem;
            white-space: nowrap;
            transition: all 0.3s ease;
            border-radius: 6px;
        }

        nav a.active, nav a:hover {
            color: var(--accent-color);
            background: rgba(255, 119, 0, 0.12);
        }

        header {
            text-align: center;
            padding: 35px 15px 25px;
            background: linear-gradient(to bottom, #0a0a0a, var(--bg-color));
            border-bottom: 1px solid var(--border-color);
        }

        .logo-container {
            margin-bottom: 10px;
        }

        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 2.3rem;
            font-weight: 700;
            color: var(--accent-color);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 119, 0, 0.3);
        }

        .logo-subtext {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--text-muted);
            margin-top: -2px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.85rem;
            max-width: 600px;
            margin: 10px auto 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 10px;
            flex-grow: 1;
            width: 100%;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            color: var(--accent-color);
            margin: 25px 0 15px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 30px;
            animation: fadeIn 0.4s ease-in-out;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
                gap: 20px;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: border-color 0.2s ease;
        }

        .card:hover { border-color: rgba(255, 119, 0, 0.4); }

        .card-img-container {
            width: 100%;
            height: 140px;
            overflow: hidden;
            position: relative;
            background-color: #080808;
            cursor: pointer;
        }

        @media (min-width: 768px) {
            .card-img-container { height: 220px; }
        }

        .card-img-container.large-img-container {
            height: 180px;
            background-color: #050505;
        }
        @media (min-width: 768px) {
            .card-img-container.large-img-container { height: 280px; }
        }

        .card-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .card-img-container.large-img-container img {
            object-fit: contain;
            padding: 5px;
        }

        .card:hover .card-img-container img { transform: scale(1.04); }

        .card-badge {
            position: absolute;
            top: 6px;
            left: 6px;
            background-color: rgba(0, 0, 0, 0.85);
            color: var(--accent-color);
            padding: 3px 8px;
            font-size: 0.65rem;
            font-weight: 700;
            border-radius: 10px;
            border: 1px solid rgba(255, 119, 0, 0.4);
            z-index: 2;
        }
        @media (min-width: 768px) {
            .card-badge { top: 10px; left: 10px; padding: 4px 10px; font-size: 0.75rem; }
        }

        .status-badge {
            position: absolute;
            bottom: 6px;
            left: 6px;
            background-color: #25d366;
            color: #000000;
            padding: 2px 6px;
            font-size: 0.6rem;
            font-weight: 700;
            border-radius: 6px;
            z-index: 2;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }
        @media (min-width: 768px) {
            .status-badge { bottom: 10px; left: 10px; padding: 3px 8px; font-size: 0.7rem; }
        }

        .price-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            background-color: var(--accent-color);
            color: #000000;
            padding: 3px 8px;
            font-size: 0.7rem;
            font-weight: 700;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
            z-index: 2;
        }
        @media (min-width: 768px) {
            .price-badge { top: 10px; right: 10px; padding: 4px 10px; font-size: 0.8rem; }
        }

        .discount-badge {
            position: absolute;
            top: 36px;
            right: 6px;
            background-color: #ff3333;
            color: #ffffff;
            padding: 3px 8px;
            font-size: 0.7rem;
            font-weight: 700;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
            z-index: 2;
            animation: pulseDiscount 1.5s infinite;
        }
        @media (min-width: 768px) {
            .discount-badge { top: 42px; right: 10px; padding: 4px 10px; font-size: 0.8rem; }
        }

        @keyframes pulseDiscount {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.08); opacity: 0.85; background-color: #ff5252; }
            100% { transform: scale(1); opacity: 1; }
        }

        .card-content {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }
        @media (min-width: 768px) {
            .card-content { padding: 16px; }
        }

        .card-title {
            font-family: 'Playfair Display', serif;
            font-size: 0.9rem;
            margin-bottom: 6px;
            color: var(--text-main);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        @media (min-width: 768px) {
            .card-title { font-size: 1.15rem; margin-bottom: 8px; }
        }

        .info-group { margin-bottom: 4px; }
        .info-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.3px; color: var(--accent-color); font-weight: 600; }
        .info-value { font-size: 0.75rem; color: var(--text-muted); }
        @media (min-width: 768px) {
            .info-label { font-size: 0.7rem; }
            .info-value { font-size: 0.85rem; }
        }

        .card-actions {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 8px;
        }
        @media (min-width: 768px) {
            .card-actions { gap: 8px; margin-top: 12px; }
        }

        .quantity-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #000000;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
        }

        .qty-btn {
            background: rgba(255, 119, 0, 0.1);
            color: var(--accent-color);
            border: none;
            width: 30px;
            height: 28px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .qty-btn:hover { background: var(--accent-color); color: #000000; }

        .qty-display {
            font-weight: 600;
            font-size: 0.85rem;
            color: white;
            text-align: center;
            flex-grow: 1;
        }

        .add-to-cart-btn {
            width: 100%;
            background-color: rgba(255, 119, 0, 0.15);
            color: var(--accent-color);
            border: 1px solid rgba(255, 119, 0, 0.4);
            padding: 6px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.2s;
            text-align: center;
        }
        @media (min-width: 768px) {
            .add-to-cart-btn { padding: 8px; font-size: 0.9rem; }
        }

        .add-to-cart-btn:hover {
            background-color: var(--accent-color);
            color: #000000;
        }

        .toast-notification {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background-color: #25d366;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            z-index: 40000;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .toast-notification.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .skeleton-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        @media (min-width: 768px) {
            .skeleton-grid { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
        }
        .skeleton-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            height: 250px;
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }
        .skeleton-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
            animation: loading 1.5s infinite;
        }
        @keyframes loading {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .fixed-bottom-cart {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--accent-color);
            color: #000000;
            padding: 10px 22px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 6px 20px rgba(255, 119, 0, 0.3);
            cursor: pointer;
            z-index: 9998;
            border: none;
            transition: transform 0.2s;
        }

        .fixed-whatsapp {
            position: fixed;
            bottom: 20px;
            right: 15px;
            background-color: #25d366;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            z-index: 9999;
            text-decoration: none;
        }
        .fixed-whatsapp svg { width: 24px; height: 24px; fill: white; }

        .lightbox-modal, .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 30000;
            padding: 15px;
        }

        .lightbox-content { position: relative; max-width: 95%; max-height: 90vh; }
        .lightbox-content img { width: 100%; height: auto; max-height: 85vh; object-fit: contain; border-radius: 8px; border: 1px solid var(--border-color); }
        .lightbox-close { position: absolute; top: -35px; right: 0; background: none; border: none; color: white; font-size: 2rem; cursor: pointer; }

        .modal {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            width: 95%;
            max-width: 500px;
            border-radius: 14px;
            padding: 20px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }

        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 12px; }
        .modal-header h2 { font-family: 'Playfair Display', serif; color: var(--accent-color); font-size: 1.3rem; }
        .close-modal { background: none; border: none; color: var(--text-muted); font-size: 1.4rem; cursor: pointer; }

        .cart-items-list { overflow-y: auto; max-height: 25vh; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
        .cart-item-row { display: flex; justify-content: space-between; align-items: center; background: #000000; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 0.85rem; }
        .cart-item-info { display: flex; flex-direction: column; gap: 2px; }
        .cart-item-title { font-weight: 600; color: var(--text-main); }
        .cart-item-details { font-size: 0.75rem; color: var(--text-muted); }

        .remove-item { color: #ff5252; background: rgba(255, 82, 82, 0.1); border: 1px solid rgba(255, 82, 82, 0.3); padding: 4px 8px; border-radius: 5px; cursor: pointer; font-size: 0.75rem; font-weight: 600; }
        
        .cart-total { font-size: 1rem; font-weight: 700; color: var(--accent-color); border-top: 1px solid var(--border-color); padding-top: 10px; display: flex; justify-content: space-between; margin-bottom: 6px; }

        .service-note {
            font-size: 0.75rem;
            color: var(--text-muted);
            background: rgba(255, 119, 0, 0.08);
            border: 1px dashed rgba(255, 119, 0, 0.3);
            padding: 8px;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 10px;
        }

        .customer-form
