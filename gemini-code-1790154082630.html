<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DivarPanel Studio ve Dizayn | Rəsmi Kataloq</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0d10;
            --card-bg: #141820;
            --card-hover: #1c222d;
            --accent-color: #d4af37;
            --accent-glow: rgba(212, 175, 55, 0.2);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #262d3d;
            --whatsapp-color: #25d366;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Navigasiya Menyu */
        nav {
            background: rgba(20, 24, 32, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 15px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 500;
            font-size: 0.8rem;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.03);
        }

        nav a:hover, nav a.active {
            color: var(--accent-color);
            background: var(--accent-glow);
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        /* Header */
        header {
            text-align: center;
            padding: 40px 20px 25px;
            background: radial-gradient(circle at center, #181c24 0%, var(--bg-color) 100%);
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            color: var(--accent-color);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            max-width: 600px;
            margin: 0 auto 20px;
        }

        /* Axtarış Sətri */
        .search-container {
            max-width: 450px;
            margin: 0 auto;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* Konteyner və Seksiyalar */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 15px;
            flex-grow: 1;
            width: 100%;
        }

        .section-wrapper {
            margin-bottom: 50px;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            color: var(--accent-color);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title::after {
            content: "";
            flex-grow: 1;
            height: 1px;
            background: linear-gradient(to right, var(--border-color), transparent);
        }

        /* Grid Sistemi */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        /* Məhsul Kartı */
        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .card:hover {
            transform: translateY(-4px);
            background-color: var(--card-hover);
            border-color: rgba(212, 175, 55, 0.4);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        .card-img-container {
            width: 100%;
            height: 220px;
            overflow: hidden;
            position: relative;
            background-color: #0f1217;
            cursor: pointer;
        }

        .card-img-container.large-img-container {
            height: 300px;
        }

        .card-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card-img-container.large-img-container img {
            object-fit: contain;
            padding: 10px;
        }

        .card:hover .card-img-container img {
            transform: scale(1.08);
        }

        /* Etiketlər (Badge & Price) */
        .card-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(11, 13, 16, 0.85);
            backdrop-filter: blur(5px);
            color: var(--accent-color);
            padding: 5px 12px;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            z-index: 2;
        }

        .price-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--accent-color);
            color: #0b0d10;
            padding: 5px 12px;
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 2;
        }

        /* Hover Sifariş Overlay */
        .order-overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: rgba(11, 13, 16, 0.9);
            backdrop-filter: blur(5px);
            color: var(--accent-color);
            text-align: center;
            padding: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            z-index: 2;
        }

        .card-img-container:hover .order-overlay {
            transform: translateY(0);
        }

        /* Kart Məzmunu */
        .card-content {
            padding: 18px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .card-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.15rem;
            margin-bottom: 8px;
            color: var(--text-main);
            line-height: 1.3;
        }

        .card-details {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 15px;
        }

        .info-row {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .info-row span {
            color: var(--accent-color);
            font-weight: 600;
        }

        /* Mobil WhatsApp Sifariş Düyməsi */
        .whatsapp-btn {
            background-color: rgba(37, 211, 102, 0.1);
            color: var(--whatsapp-color);
            border: 1px solid rgba(37, 211, 102, 0.3);
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .whatsapp-btn:hover {
            background-color: var(--whatsapp-color);
            color: white;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
        }

        /* Sabit WhatsApp Düyməsi */
        .fixed-whatsapp {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: var(--whatsapp-color);
            color: white;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
            z-index: 9999;
            transition: transform 0.3s ease;
            text-decoration: none;
        }

        .fixed-whatsapp:hover {
            transform: scale(1.1);
        }

        .fixed-whatsapp svg {
            width: 30px;
            height: 30px;
            fill: white;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 30px 20px;
            background-color: #080a0d;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            font-size: 0.85rem;
            margin-top: auto;
        }

        footer .signature {
            color: var(--accent-color);
            font-weight: 600;
            margin-top: 4px;
        }

        /* Mobil Uyğunluq */
        @media (max-width: 768px) {
            header h1 { font-size: 1.8rem; }
            header p { font-size: 0.85rem; }
            .grid { grid-template-columns: 1fr; }
            nav { padding: 8px 10px; }
            nav a { font-size: 0.75rem; padding: 5px 10px; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="#home">Hamısı</a>
        <a href="#green">Yaşıllıq</a>
        <a href="#cita">Çita</a>
        <a href="#laminat">Laminatlar</a>
        <a href="#qaya">Qaya</a>
        <a href="#guzgu">Güzgü</a>
        <a href="#bambuk">Bambuk</a>
    </nav>

    <header id="home">
        <h1>DivarPanel Studio ve Dizayn</h1>
        <p>İnteryeriniz üçün eksklüziv dekorativ panellər, süni yaşıllıq, çita, laminat, qaya, güzgü və bambuk modelləri.</p>
        
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" class="search-input" placeholder="Məhsul adı və ya kod ilə axtar..." onkeyup="filterProducts()">
        </div>
    </header>

    <div class="container" id="catalog-container">
        <p style="text-align: center; color: var(--text-muted);">Məhsullar yüklənir...</p>
    </div>

    <a href="https://wa.me/994702283682?text=Salam,%20suallarım%20var." class="fixed-whatsapp" target="_blank" title="WhatsApp ilə əlaqə">
        <svg viewBox="0 0 32 32">
            <path d="M16.002 0c-8.837 0-16 7.163-16 16 0 2.825 0.737 5.607 2.135 8.048l-2.135 7.799 8.006-2.102c2.348 1.281 5.013 1.957 7.724 1.957 8.837 0 16-7.163 16-16s-7.163-16-16-16zM16.002 29.333c-2.42 0-4.786-0.651-6.852-1.884l-0.491-0.292-5.094 1.338 1.359-4.966-0.319-0.507c-1.341-2.128-2.049-4.595-2.049-7.121 0-7.353 5.981-13.333 13.333-13.333s13.333 5.981 13.333 13.333c0 7.353-5.981 13.333-13.333 13.333zM21.905 19.467c-0.317-0.158-1.874-0.925-2.165-1.031-0.292-0.106-0.503-0.158-0.715 0.158s-0.82 1.031-1.005 1.243c-0.185 0.212-0.371 0.239-0.688 0.081-0.317-0.158-1.34-0.494-2.553-1.574-0.943-0.84-1.579-1.876-1.765-2.193-0.185-0.317-0.02-0.489 0.139-0.647 0.143-0.142 0.317-0.371 0.475-0.556 0.158-0.185 0.211-0.317 0.317-0.529 0.106-0.212 0.053-0.397-0.026-0.556s-0.715-1.724-0.98-2.362c-0.259-0.619-0.523-0.535-0.715-0.545-0.185-0.01-0.397-0.012-0.608-0.012s-0.556 0.079-0.847 0.397-0.292 0.317-1.112 1.086-1.112 2.647s1.139 3.071 1.297 3.284c0.158 0.212 2.241 3.42 5.428 4.796 0.758 0.327 1.349 0.523 1.809 0.671 0.761 0.242 1.454 0.208 2.001 0.126 0.61-0.092 1.874-0.767 2.138-1.508 0.264-0.741 0.264-1.376 0.185-1.508-0.079-0.133-0.292-0.212-0.608-0.37z"/>
        </svg>
    </a>

    <footer>
        <p>&copy; 2026 DivarPanel Studio ve Dizayn. Bütün hüquqlar qorunur.</p>
        <p class="signature">By Behram</p>
    </footer>

    <script>
        function orderOnWhatsApp(modelName) {
            const phoneNumber = "994702283682";
            const message = encodeURIComponent("Salam, " + modelName + " modelindən sifariş etmək istəyirəm.");
            window.open("https://wa.me/" + phoneNumber + "?text=" + message, "_blank");
        }

        const webappUrl = "https://script.google.com/macros/s/AKfycbwby0c025UGFx5ndgYUB3wF1Eydr11hS8YfCYQ1akgsvmdp3jWNCNjTn0apJeYsKl9U1w/exec";
        let allProductsData = {};

        fetch(webappUrl)
            .then(response => response.json())
            .then(rows => {
                const productRows = rows.slice(1);
                
                let uniqueSections = {
                    "green": { name: "Yaşıllıq Modelləri", items: [] },
                    "cita": { name: "Dekorativ Çita Modelləri", items: [] },
                    "laminat": { name: "Laminat Modelləri", items: [] },
                    "qaya": { name: "Qaya Panelləri", items: [] },
                    "guzgu": { name: "Güzgü Modelləri", items: [] },
                    "bambuk": { name: "Bambuk Panellər", items: [] }
                };

                productRows.forEach(row => {
                    if (row.length >= 6) {
                        let catText = String(row[0] || "").trim().toLowerCase();
                        let title   = String(row[1] || "").trim();
                        let price   = String(row[2] || "").trim();
                        let size    = String(row[3] || "").trim();
                        let image   = String(row[4] || "").trim();
                        let code    = String(row[5] || "").trim();
                        let desc    = String(row[6] || "").trim();

                        let key = "";
                        if (catText.includes("green") || catText.includes("yaşıl") || catText.includes("зелень") || catText.includes("ot")) key = "green";
                        else if (catText.includes("cita") || catText.includes("çita") || catText.includes("рейка")) key = "cita";
                        else if (catText.includes("laminat") || catText.includes("ламинат")) key = "laminat";
                        else if (catText.includes("qaya") || catText.includes("daş") || catText.includes("скала")) key = "qaya";
                        else if (catText.includes("guzgu") || catText.includes("зеркало")) key = "guzgu";
                        else if (catText.includes("bambuk") || catText.includes("бамбук")) key = "bambuk";

                        if (key && uniqueSections[key] && image) {
                            uniqueSections[key].items.push({ title, price, size, image, code, desc });
                        }
                    }
                });

                allProductsData = uniqueSections;
                renderCatalog(allProductsData);
            })
            .catch(error => {
                console.error(error);
                document.getElementById('catalog-container').innerHTML = '<p style="text-align: center; color: red;">Məlumatları yükləmək mümkün olmadı.</p>';
            });

        function renderCatalog(sections) {
            let container = document.getElementById('catalog-container');
            container.innerHTML = "";

            for (let key in sections) {
                let sec = sections[key];
                if (sec.items.length > 0) {
                    let isBambuk = (key === "bambuk");
                    let sectionHtml = `<div class="section-wrapper" id="${key}"><h2 class="section-title">${sec.name}</h2><div class="grid">`;
                    
                    sec.items.forEach(item => {
                        sectionHtml += `
                            <div class="card">
                                <div class="card-img-container ${isBambuk ? 'large-img-container' : ''}" onclick="orderOnWhatsApp('${item.title} (${item.code})')">
                                    <img src="${item.image}" alt="${item.title}" loading="lazy">
                                    ${item.code ? `<div class="card-badge">Kod: ${item.code}</div>` : ''}
                                    ${item.price ? `<div class="price-badge">${item.price}</div>` : ''}
                                    <div class="order-overlay">Sifariş etmək üçün klikləyin 💬</div>
                                </div>
                                <div class="card-content">
                                    <div>
                                        <h3 class="card-title">${item.title}</h3>
                                        <div class="card-details">
                                            ${item.size ? `<div class="info-row">Ölçü: <span>${item.size}</span></div>` : ''}
                                            ${item.desc ? `<div class="info-row" style="font-size: 0.8rem; color: #9ca3af; margin-top: 4px;">${item.desc}</div>` : ''}
                                        </div>
                                    </div>
                                    <a href="#" onclick="orderOnWhatsApp('${item.title} (${item.code})'); return false;" class="whatsapp-btn">
                                        💬 Sifariş Et
                                    </a>
                                </div>
                            </div>
                        `;
                    });
                    sectionHtml += `</div></div>`;
                    container.innerHTML += sectionHtml;
                }
            }
        }

        // Canlı Axtarış Funksiyası
        function filterProducts() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            let filteredSections = {};

            for (let key in allProductsData) {
                let matchedItems = allProductsData[key].items.filter(item => 
                    item.title.toLowerCase().includes(query) || 
                    item.code.toLowerCase().includes(query) || 
                    item.desc.toLowerCase().includes(query)
                );

                if (matchedItems.length > 0) {
                    filteredSections[key] = {
                        name: allProductsData[key].name,
                        items: matchedItems
                    };
                }
            }

            renderCatalog(filteredSections);
        }
    </script>
</body>
</html>
